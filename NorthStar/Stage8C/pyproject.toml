[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-stage8c-judge-bias-lab"
version = "1.11.0"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
