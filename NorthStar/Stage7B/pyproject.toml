[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-agentic-compliance-stage7b"
version = "1.7.0"
description = "NorthStar Stage 7B workload modelling and capacity-planning reference implementation"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
