[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-compliance-stage10b"
version = "1.16.0"
description = "NorthStar Stage 10B reliability, bounded deployment and AgentOps reference overlay"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
