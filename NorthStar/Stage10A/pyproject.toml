[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-agentic-compliance-stage10a"
version = "1.15.0"
description = "NorthStar Stage 10A observability and tamper-evident audit reference"
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
