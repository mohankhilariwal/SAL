[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-agentic-compliance"
version = "0.2.0"
description = "NorthStar Stage 1 bounded regulatory summarizer"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
northstar-stage1 = "northstar_compliance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
