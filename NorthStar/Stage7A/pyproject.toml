[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-agentic-compliance-stage7a"
version = "1.6.0"
description = "NorthStar Stage 7A bounded concurrency and distributed-execution reference"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
