[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-agentic-compliance"
version = "1.2.0"
description = "NorthStar Stage 5B context lifecycle and bounded memory reference implementation"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
