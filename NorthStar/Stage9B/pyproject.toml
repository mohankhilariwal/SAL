[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-stage9b-identity-blast-radius"
version = "1.13.0"
description = "NorthStar Stage 9B local reference implementation for identity, delegated authorization and blast-radius controls"
requires-python = ">=3.13,<3.14"
dependencies = ["cryptography==46.0.4"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
