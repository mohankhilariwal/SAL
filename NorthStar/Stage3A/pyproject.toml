[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-agentic-compliance"
version = "0.5.0"
description = "NorthStar Agentic AI Architecture Playbook runnable Stage 3A overlay"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
