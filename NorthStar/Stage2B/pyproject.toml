[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-agentic-compliance"
version = "0.4.0"
description = "NorthStar Stage 2B authorized retrieval, ranking, citations and RAG evaluation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy==2.3.5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
semantic-transformer = ["sentence-transformers>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
