[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-stage9a-threat-model"
version = "1.12.0"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
