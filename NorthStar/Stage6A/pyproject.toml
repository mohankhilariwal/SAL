[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "northstar-agentic-compliance"
version = "1.3.0"
description = "NorthStar Agentic AI Architecture Playbook local reference implementation"
requires-python = ">=3.11,<3.15"
dependencies = []
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
