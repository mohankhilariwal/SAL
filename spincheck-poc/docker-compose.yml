services:
  spincheck:
    build: {context: ., dockerfile: docker/Dockerfile}
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro     # control-plane artifacts mounted read-only
      - ./prompts:/app/prompts:ro
      - ./schemas:/app/schemas:ro
      - ./logs:/app/logs
