[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-synthetic-data-release-agent"
version = "0.1.0"
description = "Production-shaped local reference implementation for governed synthetic-data release"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "Sovereign Agentic Labs reference implementation"}]
dependencies = [
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "fastapi>=0.128,<0.129",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.50,<2.1",
  "alembic>=1.18,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.8,<1.9",
  "scipy>=1.14,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "structlog>=25.1,<26",
]

[project.optional-dependencies]
full = [
  "streamlit>=1.59,<2",
  "sdv>=1.37,<2",
  "sdmetrics>=0.28,<1",
  "presidio-analyzer>=2.2.363,<3",
]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16.1,<1",
  "mypy>=2.3,<3",
  "types-requests>=2.32,<3",
]

[project.scripts]
governed-release = "governed_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
markers = [
  "integration: exercises optional or infrastructure dependencies",
  "acceptance: end-to-end scenario test",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["governed_release"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
source = ["governed_release"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
